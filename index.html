
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Kalkulator Data Deskriptif Kelompok 2 untuk analisis statistik deskriptif dan visualisasi data.">

    <meta name="author" content="Kelompok 2">

    <title>Kalkulator Data Deskriptif | Kelompok 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS UTAMA -->
    <link rel="stylesheet" href="css/01-base.css">
    <link rel="stylesheet" href="css/02-components.css">
    <link rel="stylesheet" href="css/03-plugins.css">
    <link rel="stylesheet" href="css/04-print.css">

</head>

<body>

    <!-- AREA APLIKASI -->
    <div id="app-layout">

        <div class="loading-screen">
            <h2>Memuat Aplikasi...</h2>
            <p>Mohon tunggu sebentar.</p>
        </div>

    </div>


    <!-- ===================================== -->
    <!-- LIBRARY EKSTERNAL -->
    <!-- ===================================== -->

    <!-- PAPAPARSE UNTUK MEMBACA FILE CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- CHART.JS UNTUK VISUALISASI GRAFIK -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JSPDF UNTUK MEMBUAT LAPORAN PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- JSPDF AUTOTABLE UNTUK MEMBUAT TABEL PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>


    <!-- ===================================== -->
    <!-- LOAD APLIKASI MODULAR -->
    <!-- ===================================== -->

    <script type="module">

        async function loadApplication() {

            const app = document.getElementById("app-layout");

            const partials = [

                ["section-header.html", "section-header"],

                ["section-summary.html", "section-summary"],

                ["section-input.html", "section-input"],

                ["section-stats-cards.html", "section-stats-cards"],

                ["section-visualization.html", "section-visualization"],

                ["section-sorted-viewer.html", "section-sorted-viewer"],

                ["section-modal-footer.html", "section-modal-footer"]

            ];


            try {

                // =================================
                // LOAD LAYOUT UTAMA
                // =================================

                const layoutResponse = await fetch(
                    "partials/layout.html"
                );

                if (!layoutResponse.ok) {

                    throw new Error(
                        "Gagal memuat partials/layout.html. HTTP " +
                        layoutResponse.status
                    );

                }

                app.innerHTML = await layoutResponse.text();


                // =================================
                // LOAD SEMUA HTML PARTIALS
                // =================================

                for (const [file, targetId] of partials) {

                    const target = document.getElementById(targetId);

                    if (!target) {

                        throw new Error(
                            "Elemen #" + targetId +
                            " tidak ditemukan di partials/layout.html"
                        );

                    }

                    const response = await fetch(
                        "partials/" + file
                    );

                    if (!response.ok) {

                        throw new Error(
                            "Gagal memuat partials/" + file +
                            ". HTTP " + response.status
                        );

                    }

                    target.innerHTML = await response.text();

                }


                // =================================
                // PERIKSA LIBRARY
                // =================================

                if (!window.Papa) {

                    throw new Error(
                        "PapaParse gagal dimuat. Periksa koneksi internet."
                    );

                }

                if (!window.Chart) {

                    throw new Error(
                        "Chart.js gagal dimuat. Periksa koneksi internet."
                    );

                }

                if (
                    !window.jspdf ||
                    !window.jspdf.jsPDF
                ) {

                    throw new Error(
                        "jsPDF gagal dimuat. Periksa koneksi internet."
                    );

                }

                const pdfTest = new window.jspdf.jsPDF();

                if (typeof pdfTest.autoTable !== "function") {

                    throw new Error(
                        "jsPDF AutoTable gagal dimuat. Periksa koneksi internet."
                    );

                }


                // =================================
                // BERITAHU HTML SELESAI DIMUAT
                // =================================

                document.dispatchEvent(
                    new Event("partialsLoaded")
                );


                // =================================
                // JALANKAN JAVASCRIPT UTAMA
                // =================================

                await import("./js/07-main-init.js");


                console.log(
                    "STATDESK KELOMPOK 2 berhasil dimuat."
                );


            } catch (error) {

                console.error(
                    "Kesalahan aplikasi:",
                    error
                );

                app.innerHTML = `

                    <div style="
                        max-width:700px;
                        margin:70px auto;
                        padding:30px;
                        background:white;
                        border:1px solid #e5eaf1;
                        border-radius:12px;
                        font-family:Arial,sans-serif;
                        color:#17243b;
                    ">

                        <h2 style="
                            color:#dc3545;
                            margin-bottom:15px;
                        ">

                            Gagal Memuat Aplikasi

                        </h2>

                        <p style="
                            margin-bottom:15px;
                            line-height:1.6;
                        ">

                            ${error.message}

                        </p>

                        <p style="
                            font-size:13px;
                            color:#8290a2;
                            line-height:1.6;
                        ">

                            Periksa kembali struktur folder dan nama file HTML.
                            Pastikan aplikasi dijalankan menggunakan Live Server
                            dan koneksi internet tersedia untuk memuat library.

                        </p>

                    </div>

                `;

            }

        }


        // =====================================
        // MULAI APLIKASI
        // =====================================

        loadApplication();

    </script>

</body>
</html>
